# CPU-only conversation pilot; defaults are supplied by pinned Azeroth Voices.
# Endpoint/model are runtime settings: edit this mounted file; no image rebuild.
[worldserver]
AzerothVoices.Enable = 1
AzerothVoices.ProviderMode = ChatCompletions
AiPlayerbot.LLMApiEndpoint = http://127.0.0.1:11434/v1/chat/completions
AiPlayerbot.LLMApiKey = ollama-local
AzerothVoices.Model = tortoise-friends
AzerothVoices.AllowLocalHttp = 1
AzerothVoices.Thinking.Mode = Off
AzerothVoices.WorkerThreads = 1
AiPlayerbot.LLMMaxSimultaniousGenerations = 1
AzerothVoices.QueueMaximum = 4
AzerothVoices.HighPriorityReserve = 2
AzerothVoices.GlobalRequestsPerMinute = 8
AzerothVoices.RequestTTLSeconds = 60
AiPlayerbot.LLMGenerationTimeout = 60
AzerothVoices.ConnectTimeoutSeconds = 3
AzerothVoices.RetryMaximum = 0
AzerothVoices.TokenRange.Mode = 1
AzerothVoices.MinTokens = 20
AzerothVoices.MaxTokens = 80
AzerothVoices.GlobalMode = Normal
AzerothVoices.Personality.BackgroundMode = 1
AzerothVoices.GlobalPrompt.Normal = You are an AI companion chatting in World of Warcraft with a consistent fictional gamer persona. Speak casually and naturally in Australian English. Keep replies to one or two short sentences unless asked for more. Use your saved personality and relevant shared history without repeatedly introducing yourself. Do not claim to be a real human, invent remembered events, or claim to have performed gameplay actions. Return only the chat message, with no name label or stage directions.
AzerothVoices.Personality.Prompt.Traits = traits must be an array of exactly 3 distinct concise descriptors defining a believable fictional gaming companion. Vary humour, temperament and interests. Allow dry humour, friendly teasing and occasional disagreement. Avoid cruelty, repetitive catchphrases and excessive enthusiasm.
AzerothVoices.Personality.Prompt.Normal = Write a compact fictional gamer background with a few stable interests and everyday habits. Keep it grounded, varied and concise. These are persona details, not claims of being a real human. Do not invent relationships or past conversations with the player. Return only background text.
AzerothVoices.Personality.Enable = 1
AzerothVoices.Personality.GenerateOnDemand = 1
AzerothVoices.Personality.MaxTokens = 200
AzerothVoices.Personality.MaxBackgroundChars = 500
AzerothVoices.History.StorageMode = 2
AzerothVoices.History.DatabaseTTLMinutes = 43200
AzerothVoices.History.DatabaseMaximumTurns = 20
AzerothVoices.History.RamMaximumTurns = 6
AzerothVoices.History.MaximumCharacters = 2000
AzerothVoices.Memory.Enable = 1
AzerothVoices.Memory.RetentionDays = 180
AzerothVoices.Memory.MaximumPromptItems = 3
AzerothVoices.MaxResponders = 1
AzerothVoices.DisableRepliesInCombat = 1
AzerothVoices.Typing.Enable = 0
AzerothVoices.Reply.ShortTurnTokenCap.Enable = 0
AzerothVoices.Reply.MaximumCharacters = 240
AzerothVoices.Reply.MaximumLines = 2
AzerothVoices.PlayerReplyChance.Say = 100
AzerothVoices.PlayerReplyChance.Party = 100
AzerothVoices.PlayerReplyChance.TargetActive.Enable = 0
AzerothVoices.BotReplyChance.Say = 0
AzerothVoices.BotReplyChance.Party = 0
AzerothVoices.BotReplyChance.Channel = 0
AzerothVoices.BotReplyChance.Guild = 0
AzerothVoices.Replies.Whisper = 1
AzerothVoices.Replies.Say = 1
AzerothVoices.Replies.Party = 1
AzerothVoices.Replies.Raid = 0
AzerothVoices.Replies.Guild = 0
AzerothVoices.Replies.World = 0
AzerothVoices.Replies.Yell = 0
AzerothVoices.Replies.Officer = 0
AzerothVoices.Replies.CustomChannels = 0
AzerothVoices.NPC.Enable = 0
AzerothVoices.NPC.CombatStart.Enable = 0
AzerothVoices.NPC.TargetedConversation.BotComments.Enable = 0
AzerothVoices.NPC.ReplyObserver.Enable = 0
AzerothVoices.TargetedBot.Observer.Enable = 0
AzerothVoices.Proximity.Enable = 0
AzerothVoices.BossDialogue.Enable = 0
AzerothVoices.GroupChatter.Enable = 0
AzerothVoices.RaidChatter.Enable = 0
AzerothVoices.GuildChatter.Enable = 0
AzerothVoices.GuildChatter.LoginGreeting.Enable = 0
AzerothVoices.GuildChatter.PlayerReplies.Enable = 0
AzerothVoices.Random.Enable = 0
AzerothVoices.General.Enable = 0
AzerothVoices.WorldChat.Barrens.Enable = 0
AzerothVoices.Events.Enable = 0
